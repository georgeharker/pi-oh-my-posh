name: Release

# Publishes the package to npm on the v* tag via OIDC trusted publishing —
# no NPM_TOKEN secret. One-time setup at https://www.npmjs.com/ -> package ->
# Settings -> Trusted Publisher, with:
#   repository:   georgeharker/pi-oh-my-posh
#   workflow:     release.yml
#   environment:  npm
# Release: npm version patch && git push --follow-tags

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # OIDC: trusted publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          # NB: no registry-url — it writes an .npmrc expecting NODE_AUTH_TOKEN,
          # which shadows OIDC trusted publishing and makes `npm publish` 404.
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - name: Verify tag matches package version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v$tag does not match package version $pkg"
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - name: Publish to npm (trusted publishing + provenance)
        run: npm publish --provenance --access public
