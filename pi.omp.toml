# pi.omp.toml — pi footer matched to your theme.toml (Tokyo Night palette).
# Generated: palette + path/git copied verbatim from ~/.config/oh-my-posh/theme.toml,
# pi segments (model / context / tokens / status) added in your palette colors.
# Point the extension at this file:  export PI_OMP_CONFIG=<this path>
version = 3
final_space = false

[palette]
  black = '#262B44'
  blue = '#3d59a1'
  green = '#9ece6a'
  orange = '#ff9e64'
  red = '#f7768e'
  white = '#fffef4'
  yellow = '#e0af68'
  grey = '#bcbcbc'

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    template = '  {{ path .Path .Location }} '
    foreground = 'p:white'
    powerline_symbol = ''
    background = 'p:orange'
    type = 'path'
    style = 'powerline'

    [blocks.segments.properties]
      style = 'folder'

  [[blocks.segments]]
    template = ' {{ if .UpstreamURL }}{{ url .UpstreamIcon .UpstreamURL }} {{ end }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }} '
    foreground = 'p:black'
    powerline_symbol = ''
    background = 'p:green'
    type = 'git'
    style = 'powerline'
    foreground_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}p:black{{ end }}', 
                            '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:white{{ end }}',
                            '{{ if gt .Ahead 0 }}p:white{{ end }}']
    background_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}p:yellow{{ end }}',
                            '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:red{{ end }}',
                            '{{ if gt .Ahead 0 }}#49416D{{ end }}', '{{ if gt .Behind 0 }}#7A306C{{ end }}']

    [blocks.segments.properties]
      branch_template = '{{ trunc 25 .Branch }}'
      fetch_status = true
      fetch_upstream_icon = true
      branch_icon = ''

  [[blocks.segments]]
    type = 'text'
    style = 'powerline'
    powerline_symbol = ''
    background = 'p:yellow'
    foreground = 'p:black'
    template = '{{ if .Env.PI_MODEL }}  {{ .Env.PI_MODEL }}{{ if .Env.PI_THINKING }}  {{ .Env.PI_THINKING }}{{ end }} {{ end }}'

  [[blocks.segments]]
    type = 'text'
    style = 'powerline'
    powerline_symbol = ''
    background = 'p:blue'
    foreground = 'p:white'
    foreground_templates = ['{{ if ge (atoi .Env.PI_CTX_PERCENT) 90 }}p:red{{ end }}', '{{ if ge (atoi .Env.PI_CTX_PERCENT) 70 }}p:orange{{ end }}']
    template = '{{ if .Env.PI_CTX_GAUGE }} {{ .Env.PI_CTX_GAUGE }} {{ .Env.PI_CTX_PERCENT }}% {{ end }}'

  [[blocks.segments]]
    type = 'text'
    style = 'powerline'
    powerline_symbol = ''
    background = 'p:black'
    foreground = 'p:grey'
    template = '{{ if .Env.PI_TOKENS }}  {{ .Env.PI_TOKENS }} {{ end }}'

  [[blocks.segments]]
    type = 'text'
    style = 'powerline'
    powerline_symbol = ''
    background = 'p:grey'
    foreground = 'p:black'
    template = '{{ if .Env.PI_STATUS }} {{ .Env.PI_STATUS }} {{ end }}'
